<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Unlock access</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #0a0d14;
    --panel: #11151f;
    --panel-2: #161b28;
    --line: rgba(255,255,255,.07);
    --line-2: rgba(255,255,255,.12);
    --text: #eef1f8;
    --muted: #8b94a8;
    --accent: #4f8cff;
    --accent-2: #7aa7ff;
    --ok: #3ddc97;
    --bad: #ff6b81;
    --warn: #f5b74a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow-x: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Inter, sans-serif;
    -webkit-font-smoothing: antialiased; }

  .bg { position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(700px 420px at 50% -10%, rgba(79,140,255,.20), transparent 62%),
      radial-gradient(500px 380px at 100% 110%, rgba(122,92,255,.12), transparent 60%),
      var(--bg); }
  .bg::after { content: ""; position: absolute; inset: 0; opacity: .5;
    background-image: radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px); background-size: 22px 22px;
    mask-image: radial-gradient(circle at 50% 30%, #000, transparent 70%); -webkit-mask-image: radial-gradient(circle at 50% 30%, #000, transparent 70%); }

  .wrap { position: relative; z-index: 1; min-height: 100%; display: flex; align-items: center; justify-content: center;
    padding: calc(20px + env(safe-area-inset-top)) 18px calc(20px + env(safe-area-inset-bottom)); }

  .card { width: 100%; max-width: 400px; padding: 28px 20px 18px; border-radius: 26px; text-align: center;
    background: linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.02));
    border: 1px solid var(--line-2); box-shadow: 0 30px 80px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.08);
    animation: rise .6s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }

  .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 1.4px; text-transform: uppercase; color: var(--muted); margin-bottom: 18px; }

  /* avatar + progress ring */
  .avatar-wrap { position: relative; width: 116px; height: 116px; margin: 0 auto 16px; }
  .avatar-wrap svg.ring { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring-bg { fill: none; stroke: rgba(255,255,255,.08); stroke-width: 4; }
  .ring-fg { fill: none; stroke: url(#rg); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 326.7; stroke-dashoffset: 326.7;
    transition: stroke-dashoffset .8s cubic-bezier(.3,.8,.2,1); }
  .avatar { position: absolute; inset: 9px; border-radius: 50%; overflow: hidden; background: var(--panel-2);
    display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 28px rgba(0,0,0,.45); }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .avatar .initial { font-size: 40px; font-weight: 700; color: #fff; background: linear-gradient(135deg, #4f8cff, #7a5cff);
    width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  .badge { position: absolute; right: 2px; bottom: 4px; width: 30px; height: 30px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; background: var(--panel); border: 2px solid var(--bg); color: var(--accent-2);
    transition: color .3s; }
  .badge.done { color: var(--ok); }
  .badge svg { width: 15px; height: 15px; }

  h1 { margin: 0 0 6px; font-size: 21px; font-weight: 700; letter-spacing: -.2px; line-height: 1.25; word-break: break-word; }
  .sub { margin: 0 auto 20px; max-width: 300px; font-size: 13.5px; line-height: 1.55; color: var(--muted); }

  /* steps */
  .steps { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; text-align: left; }
  .row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px;
    background: var(--panel); border: 1px solid var(--line); transition: border-color .3s, background .3s, transform .3s; }
  .row .dot { flex: none; width: 28px; height: 28px; border-radius: 9px; display: flex; align-items: center; justify-content: center;
    font-size: 12.5px; font-weight: 700; color: var(--muted); background: rgba(255,255,255,.06); transition: all .3s; }
  .row .dot svg { width: 15px; height: 15px; }
  .row .t { flex: 1; font-size: 14px; font-weight: 600; }
  .row .t small { display: block; margin-top: 2px; font-size: 11.5px; font-weight: 500; color: var(--muted); }
  .row .st { flex: none; font-size: 11.5px; font-weight: 600; color: var(--muted); }
  .row.cur { border-color: rgba(79,140,255,.55); background: linear-gradient(180deg, rgba(79,140,255,.10), rgba(79,140,255,.04)); transform: scale(1.01); }
  .row.cur .dot { color: #fff; background: var(--accent); box-shadow: 0 0 0 4px rgba(79,140,255,.18); }
  .row.cur .st { color: var(--accent-2); }
  .row.done .dot { color: #06140d; background: var(--ok); }
  .row.done .st { color: var(--ok); }
  .row.skip .dot { color: var(--warn); }
  .row.skip .st { color: var(--warn); }

  .btn { position: relative; overflow: hidden; width: 100%; border: 0; border-radius: 15px; padding: 15px 16px; font-size: 15.5px; font-weight: 650;
    color: #fff; cursor: pointer; letter-spacing: .1px; display: flex; align-items: center; justify-content: center; gap: 9px;
    background: linear-gradient(180deg, #5b95ff, #3f78f0); box-shadow: 0 10px 26px rgba(63,120,240,.38), inset 0 1px 0 rgba(255,255,255,.25);
    transition: transform .15s, opacity .2s, box-shadow .2s; }
  .btn svg { width: 17px; height: 17px; }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .55; box-shadow: none; cursor: default; }
  .btn.alt { background: var(--panel-2); box-shadow: none; border: 1px solid var(--line-2); }
  .spin { width: 16px; height: 16px; border-radius: 50%; border: 2.5px solid rgba(255,255,255,.3); border-top-color: #fff; animation: rot .75s linear infinite; }
  @keyframes rot { to { transform: rotate(360deg); } }

  .msg { min-height: 18px; margin-top: 12px; font-size: 12.5px; color: var(--muted); transition: color .25s; }
  .msg.bad { color: var(--bad); } .msg.good { color: var(--ok); }
  .foot { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 10px; font-size: 11px; color: rgba(139,148,168,.7); }
  .foot svg { width: 12px; height: 12px; }

  .screen { display: none; } .screen.on { display: block; animation: fade .45s ease both; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .loader { width: 40px; height: 40px; margin: 40px auto 16px; border-radius: 50%; border: 3px solid rgba(255,255,255,.08); border-top-color: var(--accent); animation: rot .8s linear infinite; }

  .big { width: 88px; height: 88px; margin: 6px auto 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .big.ok { background: rgba(61,220,151,.10); border: 1px solid rgba(61,220,151,.4); color: var(--ok); animation: pop .5s cubic-bezier(.3,1.5,.4,1) both; }
  .big.bad { background: rgba(255,107,129,.10); border: 1px solid rgba(255,107,129,.4); color: var(--bad); animation: shake .5s ease both; }
  .big svg { width: 40px; height: 40px; }
  .big.ok svg path { stroke-dasharray: 40; stroke-dashoffset: 40; animation: draw .5s .2s ease forwards; }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes shake { 25%,75% { transform: translateX(-6px); } 50% { transform: translateX(6px); } }
  .hidden { display: none !important; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-play" viewBox="0 0 24 24"><path fill="currentColor" d="M8 5.2v13.6a1 1 0 0 0 1.5.86l11-6.8a1 1 0 0 0 0-1.72l-11-6.8A1 1 0 0 0 8 5.2z"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M6 11V8a6 6 0 0 1 12 0v3M5 11h14v10H5z"/></symbol>
    <symbol id="i-unlock" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M6 11V8a6 6 0 0 1 11.2-3M5 11h14v10H5z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" d="M6 12h12"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6z"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M12 8v5M12 17h.01M10.3 3.9L2.6 17.5A2 2 0 0 0 4.3 20.5h15.4a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></symbol>
  </defs>
</svg>
<div class="bg"></div>

<div class="wrap">
  <div class="card">

    <div class="screen on" id="s-load">
      <div class="loader"></div>
      <div class="sub">Preparing your session</div>
    </div>

    <div class="screen" id="s-main">
      <div class="eyebrow">Unlocking access to</div>
      <div class="avatar-wrap">
        <svg class="ring" viewBox="0 0 120 120">
          <defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f8cff"/><stop offset="1" stop-color="#7a5cff"/></linearGradient></defs>
          <circle class="ring-bg" cx="60" cy="60" r="52"/>
          <circle class="ring-fg" id="ring" cx="60" cy="60" r="52"/>
        </svg>
        <div class="avatar" id="avatar"></div>
        <div class="badge" id="badge"><svg><use href="#i-lock"/></svg></div>
      </div>
      <h1 id="title">Your link</h1>
      <p class="sub" id="sub">Watch the short ads below. Your link is sent to the chat as soon as you finish.</p>
      <div class="steps" id="steps"></div>
      <button class="btn" id="btn"><svg><use href="#i-play"/></svg><span>Watch ad</span></button>
      <div class="msg" id="msg"></div>
      <div class="foot"><svg><use href="#i-shield"/></svg>Secure verification</div>
    </div>

    <div class="screen" id="s-done">
      <div class="big ok"><svg viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <h1>Access unlocked</h1>
      <p class="sub">Your link has been sent to the chat.</p>
      <div class="foot" id="closing">Closing automatically</div>
    </div>

    <div class="screen" id="s-err">
      <div class="big bad"><svg><use href="#i-alert"/></svg></div>
      <h1 id="err-title">Something went wrong</h1>
      <p class="sub" id="err-text"></p>
      <button class="btn alt" id="err-close"><span>Close</span></button>
    </div>

  </div>
</div>

<script>
(function () {
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    tg.ready(); tg.expand();
    try { tg.setHeaderColor('#0a0d14'); tg.setBackgroundColor('#0a0d14'); } catch (e) {}
    try { tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {}
  }
  const $ = (id) => document.getElementById(id);
  const haptic = (t) => { try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred(t); } catch (e) {} };
  const tap = () => { try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred('light'); } catch (e) {} };
  const show = (n) => ['load', 'main', 'done', 'err'].forEach((x) => $('s-' + x).classList.toggle('on', x === n));
  const closeApp = () => { tg ? tg.close() : window.close(); };
  const icon = (id) => '<svg><use href="#' + id + '"/></svg>';

  const token = new URLSearchParams(location.search).get('t') || '';
  const initData = tg ? tg.initData : '';

  const ERRORS = {
    auth:        ['Open from Telegram', 'This page only works inside the bot as a Telegram Mini App.'],
    invalid:     ['Link not valid', 'Go back to the bot and open the channel link again.'],
    used:        ['Already used', 'This verification was already used. Open the original link in the bot again.'],
    not_yours:   ['Not your link', 'Open the link from your own account in the bot.'],
    no_ads:      ['No ads available', 'Please try again in a little while.'],
    no_ad_shown: ['Ads did not load', 'Turn off AdBlock or VPN and open the link in the bot again.'],
    incomplete:  ['Ads not finished', 'Please try again.'],
    too_fast:    ['Please wait a moment', 'Ads must be watched fully before verification. Try again.'],
    invite_error:['Could not create link', 'Go back to the bot and try again.'],
    server:      ['Server error', 'Please try again in a little while.'],
    default:     ['Something went wrong', 'Please try again.']
  };
  function fail(code) {
    const e = ERRORS[code] || ERRORS.default;
    $('err-title').textContent = e[0]; $('err-text').textContent = e[1];
    try { tg && tg.disableClosingConfirmation(); } catch (x) {}
    haptic('error'); show('err');
  }
  $('err-close').onclick = closeApp;

  async function api(path, extra) {
    const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.assign({ initData: initData, token: token }, extra || {})) });
    return r.json();
  }

  // ───────────── Ad providers ─────────────
  const loaded = {};
  function loadScript(src, attrs, key) {
    if (loaded[key]) return loaded[key];
    loaded[key] = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src;
      Object.keys(attrs || {}).forEach((k) => s.setAttribute(k, attrs[k]));
      const t = setTimeout(() => reject(new Error('load timeout')), 12000);
      s.onload = () => { clearTimeout(t); resolve(); };
      s.onerror = () => { clearTimeout(t); reject(new Error('load error')); };
      document.head.appendChild(s);
    });
    return loaded[key];
  }
  const loadMonetag = (id) => loadScript('https://libtl.com/sdk.js', { 'data-zone': id, 'data-sdk': 'show_' + id }, 'monetag-' + id);
  let USER_ID = '';

  // 'ok' | 'skipped' (user closed early: retry) | 'failed' (load / no fill: move on)
  const PROVIDERS = {
    monetag: async (id) => {
      try { await loadMonetag(id); const fn = window['show_' + id]; if (typeof fn !== 'function') return 'failed';
        await fn(USER_ID ? { ymid: String(USER_ID) } : undefined); return 'ok'; }
      catch (e) { return 'failed'; }
    },
    monetag_pop: async (id) => {
      try { await loadMonetag(id); const fn = window['show_' + id]; if (typeof fn !== 'function') return 'failed'; await fn('pop'); return 'ok'; }
      catch (e) { return 'failed'; }
    },
    adsgram: async (id) => {
      try {
        await loadScript('https://sad.adsgram.ai/js/sad.min.js', {}, 'adsgram');
        if (!window.Adsgram) return 'failed';
        const res = await window.Adsgram.init({ blockId: String(id) }).show();
        return res && res.done ? 'ok' : 'skipped';
      } catch (res) { return (res && res.error === false) ? 'skipped' : 'failed'; }
    },
    gigapub: async (id) => {
      try {
        await loadScript('https://ad.gigapub.tech/script?id=' + encodeURIComponent(id), {}, 'gigapub-' + id);
        if (typeof window.showGiga !== 'function') return 'failed';
        await window.showGiga(); return 'ok';
      } catch (e) { return 'failed'; }
    }
  };

  // ───────────── State + render ─────────────
  let steps = [], status = [], idx = 0, shown = 0, failed = 0, busy = false;
  const CIRC = 326.7;
  const setRing = (f) => { $('ring').style.strokeDashoffset = String(CIRC * (1 - Math.max(0, Math.min(1, f)))); };
  const setMsg = (t, c) => { const m = $('msg'); m.textContent = t || ''; m.className = 'msg' + (c ? ' ' + c : ''); };
  const setBtn = (html, disabled) => { const b = $('btn'); b.innerHTML = html; b.disabled = !!disabled; };

  function buildAvatar(ch) {
    const box = $('avatar'); box.innerHTML = '';
    const name = (ch && ch.title) || '';
    const initial = document.createElement('div');
    initial.className = 'initial';
    initial.textContent = (name.trim()[0] || 'C').toUpperCase();
    if (ch && ch.has_photo) {
      const img = new Image();
      img.alt = '';
      img.onload = () => { box.innerHTML = ''; box.appendChild(img); };
      img.onerror = () => { box.innerHTML = ''; box.appendChild(initial); };
      img.src = '/miniapp/photo?t=' + encodeURIComponent(token);
      box.appendChild(initial);   // placeholder jab tak photo load ho
    } else { box.appendChild(initial); }
    $('title').textContent = name || 'Your link';
  }

  function render() {
    const el = $('steps'); el.innerHTML = '';
    steps.forEach((_, i) => {
      const st = status[i];
      const row = document.createElement('div');
      row.className = 'row' + (st === 'ok' ? ' done' : st === 'skip' ? ' skip' : i === idx ? ' cur' : '');
      const dot = st === 'ok' ? icon('i-check') : st === 'skip' ? icon('i-minus') : String(i + 1);
      const label = st === 'ok' ? 'Completed' : st === 'skip' ? 'Unavailable' : i === idx ? 'Up next' : 'Waiting';
      row.innerHTML = '<div class="dot">' + dot + '</div><div class="t">Sponsored video ' + (i + 1) +
        '<small>Short video ad</small></div><div class="st">' + label + '</div>';
      el.appendChild(row);
    });
    const done = shown + failed;
    setRing(steps.length ? done / steps.length : 0);
  }

  // ───────────── Flow ─────────────
  async function finish() {
    setBtn('<div class="spin"></div><span>Verifying</span>', true);
    setMsg('');
    let res;
    try { res = await api('/api/mini/complete', { shown: shown, failed: failed }); } catch (e) { return fail('server'); }
    if (!res.ok && res.error === 'too_fast') {
      await new Promise((r) => setTimeout(r, 4000));
      try { res = await api('/api/mini/complete', { shown: shown, failed: failed }); } catch (e) { return fail('server'); }
    }
    if (!res.ok) return fail(res.error);
    try { tg && tg.disableClosingConfirmation(); } catch (e) {}
    $('badge').className = 'badge done'; $('badge').innerHTML = icon('i-unlock');
    show('done'); haptic('success');
    setTimeout(closeApp, 2200);
  }

  const nextLabel = () => '<svg><use href="#i-play"/></svg><span>Watch ad ' + (idx + 1) + ' of ' + steps.length + '</span>';

  async function playCurrent() {
    if (busy) return;
    busy = true; tap();
    setBtn('<div class="spin"></div><span>Loading ad</span>', true);
    setMsg('');
    const ad = steps[idx];
    const fn = PROVIDERS[ad.provider];
    const result = fn ? await fn(ad.id) : 'failed';

    if (result === 'ok') { status[idx] = 'ok'; shown++; idx++; haptic('success'); }
    else if (result === 'failed') { status[idx] = 'skip'; failed++; idx++; setMsg('That ad was not available, moving on.'); }
    else { setMsg('Please watch the ad to the end to continue.', 'bad'); haptic('warning'); }
    busy = false;
    render();

    if (idx >= steps.length) {
      if (shown < 1) return fail('no_ad_shown');
      return finish();
    }
    setBtn(result === 'skipped' ? '<svg><use href="#i-play"/></svg><span>Try again</span>' : nextLabel(), false);
  }
  $('btn').onclick = playCurrent;

  (async function init() {
    if (!token || !initData) return fail('auth');
    let res;
    try { res = await api('/api/mini/init'); } catch (e) { return fail('server'); }
    if (!res.ok) return fail(res.error);
    steps = res.steps || [];
    if (!steps.length) return fail('no_ads');
    USER_ID = res.uid || '';
    status = steps.map(() => null);
    try { tg && tg.enableClosingConfirmation(); } catch (e) {}
    buildAvatar(res.channel);
    $('sub').textContent = steps.length === 1
      ? 'Watch one short ad. Your link is sent to the chat as soon as you finish.'
      : 'Watch ' + steps.length + ' short ads. Your link is sent to the chat as soon as you finish.';
    render(); setBtn(nextLabel(), false); show('main');
  })();
})();
</script>
</body>
</html>
